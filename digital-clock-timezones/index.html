<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-globe"></i> Global Time Zone Clock</h1>
            <p class="subtitle">Real-time clock across multiple time zones</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="timezoneSearch" placeholder="Search timezone (e.g., New York, Tokyo, London)...">
            </div>
            <button class="btn btn-primary" onclick="addTimeZone()">
                <i class="fas fa-plus"></i> Add Timezone
            </button>
            <button class="btn btn-secondary" onclick="resetClocks()">
                <i class="fas fa-redo"></i> Reset
            </button>
        </div>

        <div class="timezone-selector">
            <select id="timezoneInput" onclick="handleTimezoneSelect()">
                <option value="">Select a timezone...</option>
            </select>
        </div>

        <div class="clocks-grid" id="clocksContainer">
            <!-- Clocks will be dynamically added here -->
        </div>

        <div class="stats">
            <p>Total Timezones: <span id="timezoneCount">0</span></p>
            <p>Last Updated: <span id="lastUpdate">--:--:--</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
